- label: ":amd: (MI300) Fusion E2E Quick" # TBD
  timeout_in_minutes: 30
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx942nightly, amdmi300]
  dind: false
  agent_pool: mi300_1
  num_gpus: 1
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - csrc/quantization/
  - vllm/model_executor/
  - vllm/v1/attention/
  - vllm/compilation/
  - tests/compile/fusions_e2e/
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  optional: true
  commands:
  - rocm-smi
  # Run all models and attn backends but only Inductor partition and native custom ops
  - "pytest -v -s tests/compile/fusions_e2e/test_tp1_quant.py -k 'inductor_partition and not +rms_norm and not +quant_fp8'"
  # Different from CUDA, Qwen requires +rms_norm and +quant_fp8 as rms+quant fusion is only supported on AITER
  - "pytest -v -s tests/compile/fusions_e2e/test_tp1_quant.py -k 'inductor_partition and +rms_norm and +quant_fp8 and qwen3'"
  # DeepSeek-Coder uses the portable static-FP8 MLA fusion path on ROCm.
  - "pytest -v -s tests/compile/fusions_e2e/test_tp1_quant.py -k 'inductor_partition and not +rms_norm and +quant_fp8 and DeepSeek-Coder and TRITON_MLA and not True'"

